blocking_issues:
  - title: "0G Compute SDK Function Undefined"
    severity: "✅ RESOLVED"
    affected: 
      - "/api/0g-compute/init"
      - "/api/0g-compute/analyze"
      - "/api/0g-compute/status"
      - "/api/0g-compute/init-account"
    original_error: "createZGComputeNetworkBroker is undefined at runtime"
    root_cause: |
      The @0glabs/0g-serving-broker package uses a complex exports field in 
      package.json that doesn't properly expose TypeScript types when using 
      ESM imports in Next.js API routes. The package has both CommonJS and 
      ESM builds, but Next.js webpack was having trouble resolving the correct 
      module format.
    solution: |
      Changed from ESM import to CommonJS require():
      
      BEFORE (broken):
      import { createZGComputeNetworkBroker } from '@0glabs/0g-serving-broker';
      
      AFTER (working):
      const createBroker = async (wallet: ethers.Wallet) => {
        // @ts-ignore - Using require for CommonJS compatibility
        const { createZGComputeNetworkBroker } = require('@0glabs/0g-serving-broker');
        return createZGComputeNetworkBroker(wallet);
      };
    
    additional_fixes:
      - "Removed src/types/0g-serving-broker.d.ts (conflicting with package types)"
      - "Removed custom path mapping in tsconfig.json"
      - "Updated next.config.ts with serverExternalPackages configuration"
      - "Added webpack fallbacks for Node.js modules"
      - "Created shared storage module at src/lib/storage.ts"
      - "Removed invalid exports from API routes"
    
    status: "✅ WORKING - Build passes, ready for runtime testing"

  - title: "Spline 3D Component Module Resolution"
    severity: "⚠️ WORKAROUND APPLIED"
    affected:
      - "src/components/blocks/3d-hero-section-boxes.tsx"
    error: "Package path . is not exported from @splinetool/react-spline"
    solution: |
      Temporarily replaced Spline 3D component with gradient background.
      The component can be re-enabled later by fixing webpack configuration
      or upgrading to a compatible version of the package.
    status: "⚠️ WORKAROUND - App functional, 3D disabled"

