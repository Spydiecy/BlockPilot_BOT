        - vulnerabilities.medium[0-2]: Expected string, received object
        - vulnerabilities.low[0-3]: Expected string, received object
      
      root_cause: |
        Mistral AI was returning vulnerability items as objects with fields like
        {description: "...", severity: "...", line: 123} instead of plain strings.
        The backend was attempting to convert these to strings, but the conversion
        logic wasn't comprehensive enough to handle all object structures.
      
      solution_applied:
        file: "src/app/api/ai/analyze/route.ts"
        timestamp: "2026-05-12T13:05:00Z"
