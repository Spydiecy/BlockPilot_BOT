[build]
  command = "npm run build -- --webpack"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # Increase timeout for AI routes — Mistral calls can take 20-30s for large contracts
  included_files = ["**"]

  [functions."___netlify-server-handler"]
    timeout = 60

[[plugins]]
  package = "@netlify/plugin-nextjs"
